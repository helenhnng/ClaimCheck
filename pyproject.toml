[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.1.0"
description = "Pre-submission claim checker for home-care agency billing teams (Exchange4Health take-home)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "pyyaml",
    "streamlit",
    "pytest",
    "anthropic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimcheck = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
