# ClaimCheck payer rule parameters.
# Source: docs/payer_rules.md sections 3 and 6 (distilled from 1. RAW DATA/payers/*.md,
# billing_basics.md and denial_codes.md). Rule logic lives in rules.py and reads from here.
# Items marked TBC are defaults still to be confirmed on the dev split (docs/findings.md).
# A new bulletin is a new dated entry here, reviewed by a person before it goes live.

version: 1

global:
  unit_minutes: 15
  evv_valid_statuses: [verified]             # billing_basics.md: only verified visits count
  evv_pending_statuses: [manual_edit_pending] # not a denial yet: advise "hold"
  evv_aggregation: sum_then_round            # TBC: alternative is round_then_sum
  filing_boundary: gt                        # TBC: deny if days > limit ("gt") or >= limit ("ge")
  duplicate_key: [payer_id, patient_id, service_code, date_of_service]
  duplicate_frequency_codes: [1]             # frequency 7 (corrected claim) is never a duplicate
  near_limit_units: 2                        # review if within this many units of a limit
  # TBC: which code the payer reports when several rules are broken (placeholder order).
  precedence: [D07, D08, D05, D03, D01, D04, D09, D02, D06, D10]

payers:
  PY01:
    name: Northwind Health Plan
    rounding: eight_minute_rule              # m // 15, plus 1 if the remainder is >= 8 minutes
    eight_minute_threshold: 8
    timely_filing:
      - {dos_from: null, dos_to: 2026-07-31, days: 30, citation: "PY01 Manual §6.1"}
      - {dos_from: 2026-08-01, dos_to: null, days: 45, citation: "PY01 Manual §6.1 + Bulletin 2026-07"}
    modifier_rules: []                       # none documented. TBC: PY01 claims carry U1
    daily_max_units: null
    contract_rules: []
    citations:
      evv: "PY01 Manual §4.2"
      units: "PY01 Manual §4.3"
      auth: "PY01 Manual §4.5"
      duplicate: "PY01 Manual §6.4"

  PY02:
    name: Harbor Medicaid Plan
    rounding: floor                          # complete 15-minute increments only
    timely_filing: []                        # no filing limit for in-state HCBS providers
    modifier_rules:
      - {service: T1019, dos_from: null, dos_to: 2026-08-31, days: all, required: U2,
         citation: "PY02 Billing Guide, Modifiers"}
      - {service: T1019, dos_from: 2026-09-01, dos_to: null, days: weekday, required: U2,
         citation: "PY02 Billing Guide, Modifiers + Provider Notice 2026-08"}
      - {service: T1019, dos_from: 2026-09-01, dos_to: null, days: weekend, required: U3,
         citation: "PY02 Provider Notice 2026-08"}
    daily_max_units: {limit: 32, scope: all_services, basis: paid_total,
                      citation: "PY02 Billing Guide, Daily maximum"}
    contract_rules: []
    citations:
      evv: "PY02 Billing Guide, Visit verification"
      units: "PY02 Billing Guide, Visit verification"
      auth: "PY02 Billing Guide, Authorizations"
      duplicate: "PY02 Billing Guide, Duplicates"

  PY03:
    name: Summit Care Partners
    rounding: floor                          # partial units are not billable
    timely_filing:
      - {dos_from: null, dos_to: null, days: 60, citation: "PY03 Handbook §9.3"}
    modifier_rules: []
    daily_max_units: null
    contract_rules:
      # Not in the handbook; found in history remarks (docs/payer_rules.md section 6).
      - id: amendment_3_whole_hours
        denial_code: D10
        units_multiple_of: 4                 # whole hours
        effective_from: null                 # TBC
        agencies: null                       # TBC: null = all agencies
        enabled: false                       # TBC: off until its scope is checked on dev
        citation: "PY03 Handbook §9.5 (contract amendment 3, inferred from history remarks)"
    citations:
      evv: "PY03 Handbook §9.1"
      units: "PY03 Handbook §9.1"
      auth: "PY03 Handbook §9.2"
      duplicate: "PY03 Handbook §9.4"

shared_citations:
  evv_basis: "billing_basics.md (verified visits only; clock-in date; same-day visits summed)"
  auth_drawdown: "billing_basics.md (paid claims draw down in submission order)"
  duplicate: "billing_basics.md (same payer, patient, service and date of service)"
